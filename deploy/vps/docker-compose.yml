# Any Linux server with Docker: point DOMAIN's DNS at it, then
#   DOMAIN=camera.example.com ADMIN_TOKEN=... docker compose up -d --build
# Caddy gets the HTTPS certificate on its own; phones need HTTPS for the camera.
services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      PORT: '8080'
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - pbmp-data:/src/server/data
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the address phones will open}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pbmp-data:
  caddy-data:
  caddy-config:
